appId: com.pageturn.app
productName: PageTurn
copyright: Copyright © 2026 Guninder Singh Bhatia
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!tests/*'
  - '!scripts/*'
  - '!.superpowers/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - '**/*.node'
  - resources/icon.png
# The Welcome book, imported on first run from process.resourcesPath/sample.
extraResources:
  - from: resources/sample
    to: sample
fileAssociations:
  # Appears in "Open with"; PageTurn does not take over as the default PDF app.
  - ext: pdf
    name: PDF Document
    description: PDF Document
    role: Viewer
afterPack: scripts/fuses.cjs
win:
  executableName: PageTurn
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
  # Code signing runs only when CSC_LINK / CSC_KEY_PASSWORD are set; unsigned builds work.
nsis:
  oneClick: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: PageTurn-Setup-${version}.${ext}
  shortcutName: PageTurn
  uninstallDisplayName: PageTurn
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: PageTurn-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Guninder Singh Bhatia
  category: Office
appImage:
  artifactName: PageTurn-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: GuninderSinghBhatia
  repo: pageturn
